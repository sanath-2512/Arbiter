# Default submission profile. This file is the harness's model configuration.
#
# The evaluator supplies only AI_API_KEY. [model] below pins a model when the organisers prescribe
# one (set provider, name and base_url; the harness then never substitutes another model).
# Until then provider = "auto": the ordered [[auto]] rules at the end of this file map the key's
# format to exactly one provider endpoint and a model preference list. The key is only ever sent
# to that endpoint. The resolved provider/model/endpoint are printed at start-up and recorded in
# every result. AI_MODEL / AI_BASE_URL / AI_PROVIDER override these values without editing files.
name = "default"

[model]
provider = "auto"                 # auto | openai_chat | anthropic_messages
name = ""                         # pin the prescribed model id here (or AI_MODEL)
base_url = ""                     # pin the endpoint here (or AI_BASE_URL)
api_key_env = "AI_API_KEY"
tool_protocol = "native"          # native function calling; "text" = delimited text actions
max_output_tokens = 8192
max_tokens_field = "max_tokens"   # auto rules override this where the provider needs it
context_window = 128000           # conservative; overflow errors also lower it adaptively
request_timeout_s = 300
# temperature: provider default (unset) — see README "Reproducibility"

[retry]
max_attempts = 6
base_delay_s = 2.0
max_delay_s = 60.0
seed = 0
transient_window_s = 600.0    # rate limits / overloaded provider: keep retrying this long (within the deadline)

[limits]                          # defaults; per-task limits from the evaluator take precedence
time_limit_s = 1800
max_steps = 150
finalize_reserve_s = 45

[tools]
set = "full"
bash_timeout_s = 180
max_observation_chars = 12000
read_max_lines = 400

[policy]
repo_overview = true
submit_review = true
recover_empty_final = true
dominance_selection = true
final_recheck = true
budget_notices = true
repetition_notice = true
git_hygiene = true

# ---------------------------------------------------------------------------------------------
# Credential-format rules for provider = "auto" (first match wins). `models` is an ordered
# preference list; the first one the provider's /models endpoint reports is used and recorded.
# Formats: public key prefixes documented by each provider; OpenAI keys embed "T3BlbkFJ".

[[auto]]
label = "Anthropic"
match = "prefix:sk-ant-"
provider = "anthropic_messages"
base_url = "https://api.anthropic.com"
models = ["claude-sonnet-5", "claude-opus-5-5", "claude-sonnet-4-5", "claude-sonnet-4"]
context_window = 200000
prompt_cache = true                 # cached prefix: ~10x cheaper input; cache reads do not count toward ITPM limits

[[auto]]
label = "OpenRouter"
match = "prefix:sk-or-"
provider = "openai_chat"
stream = true                     # thinking answers take minutes: stream so the idle timeout never fires
base_url = "https://openrouter.ai/api/v1"
models = ["qwen/qwen3.8-max", "deepseek/deepseek-v4-pro", "qwen/qwen3-coder", "deepseek/deepseek-v4.1-flash",
          "qwen/qwen3.7-max", "deepseek/deepseek-chat"]
max_output_tokens = 32768

[[auto]]
label = "OpenAI"
match = "regex:^sk-(proj|svcacct|admin)-|T3BlbkFJ"
provider = "openai_chat"
base_url = "https://api.openai.com/v1"
models = ["gpt-5.1", "gpt-5", "gpt-4.1", "gpt-4o"]
max_tokens_field = "max_completion_tokens"
max_output_tokens = 32768           # reasoning tokens count against this budget; lowered automatically if capped

# DeepSeek and Alibaba Cloud (Qwen) both issue `sk-` + 32 hex keys: one rule, candidate endpoints tried
# in order, moving on only when an endpoint answers 401 (see arbiter/resolve.py).
# Thinking models: output budget covers reasoning; the context window is a working budget (tokens
# cost), not the provider maximum (1M); reasoning is passed back on tool-call turns as required.
[[auto]]
label = "DeepSeek"
match = "regex:^sk-[0-9a-f]{32}$"
provider = "openai_chat"
stream = true                     # thinking answers take minutes: stream so the idle timeout never fires
base_url = "https://api.deepseek.com"
models = ["deepseek-v4-pro", "deepseek-flash", "deepseek-v4-flash", "deepseek-chat"]
max_output_tokens = 32768
context_window = 200000
reasoning_passback = "auto"
candidates = [
  { label = "Alibaba Cloud Model Studio (Singapore)", base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1", models = ["qwen3.8-max", "qwen3-coder-plus", "qwen3.7-max", "qwen3-coder-next", "qwen3.6-plus", "qwen-plus"], extra_headers = { X-DashScope-CacheControl = "enable" } },
  { label = "Alibaba Cloud Model Studio (Beijing)", base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1", models = ["qwen3.8-max", "qwen3-coder-plus", "qwen3.7-max", "qwen3-coder-next", "qwen3.6-plus", "qwen-plus"], extra_headers = { X-DashScope-CacheControl = "enable" } },
  { label = "Alibaba Cloud Model Studio (US)", base_url = "https://dashscope-us.aliyuncs.com/compatible-mode/v1", models = ["qwen3.8-max", "qwen3-coder-plus", "qwen3.7-max", "qwen3-coder-next", "qwen3.6-plus", "qwen-plus"], extra_headers = { X-DashScope-CacheControl = "enable" } },
  { label = "QwenCloud", base_url = "https://maas.qwencloudapi.com/compatible-mode/v1", models = ["qwen3.8-max", "qwen3-coder-plus", "qwen3.7-max", "qwen3-coder-next", "qwen3.6-plus"] },
  { label = "Alibaba Cloud Model Studio (Hong Kong)", base_url = "https://cn-hongkong.dashscope.aliyuncs.com/compatible-mode/v1", models = ["qwen3.8-max", "qwen3-coder-plus", "qwen3.7-max", "qwen3.6-plus", "qwen-plus"], extra_headers = { X-DashScope-CacheControl = "enable" } },
]

